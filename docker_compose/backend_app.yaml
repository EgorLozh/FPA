services:
  app:
    container_name: app
    build: ..
    command: >
      sh -c "poetry run python app/manage.py makemigrations &&
             poetry run python app/manage.py migrate &&
             poetry run python app/manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../.:/app
    ports:
      - "80:8000"
      # - "${API_PORT}:8000"
    depends_on:
      - db
    env_file:
      - ../.env
